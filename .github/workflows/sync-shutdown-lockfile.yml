name: Sync graceful-shutdown generated files

on:
  push:
    branches:
      - agent/graceful-shutdown-contract
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/server.rs
      - src/server/shutdown.rs
      - .github/workflows/sync-shutdown-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-graceful-shutdown-generated-files
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out rollout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply canonical Rust formatting
        run: cargo fmt --all

      - name: Resolve dependency graph and compile every test target
        run: cargo test --no-run --all-targets --all-features

      - name: Commit only generated shutdown artifacts
        shell: bash
        run: |
          set -euo pipefail

          changed="$(git diff --name-only)"
          if [[ -z "$changed" ]]; then
            echo 'Generated shutdown artifacts are already current.'
            exit 0
          fi

          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^(Cargo\.lock|src/server\.rs|src/server/shutdown\.rs)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Refusing to commit unexpected generated changes:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock src/server.rs src/server/shutdown.rs
          git commit -m 'chore: sync shutdown generated artifacts'
          git push origin "HEAD:${GITHUB_REF_NAME}"
