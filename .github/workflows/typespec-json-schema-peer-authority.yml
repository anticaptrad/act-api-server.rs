name: TypeSpec and JSON Schema peer-authority parity

on:
  pull_request:
    paths:
      - "test/fixtures/schema-authority-canary/**"
      - "contracts/transport/**"
      - "src/web_api_plane.rs"
      - ".github/workflows/typespec-json-schema-peer-authority.yml"
  push:
    branches: [main, dev]
    paths:
      - "test/fixtures/schema-authority-canary/**"
      - "contracts/transport/**"
      - "src/web_api_plane.rs"
      - ".github/workflows/typespec-json-schema-peer-authority.yml"
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-peer-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify checked-out revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Generate Schema B and compare both peer authorities
        uses: ORESoftware/typespec-json-schema-validator@5b04b08512f8a03a376dcb96818969e2d83c2d84
        with:
          typespec: test/fixtures/schema-authority-canary/main.tsp
          schema: test/fixtures/schema-authority-canary/authored.schema.json
          report: .typespec-json-schema-validator/report.json
          contract_ir: .typespec-json-schema-validator/contract-ir.json
          output_dir: .typespec-json-schema-validator/generated
          max_probes: "64"

      # This canary verifies gate admission, not unrelated product contracts.
      - name: Require current evidence and the canonical consumer-admission refusals
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@5b04b08512f8a03a376dcb96818969e2d83c2d84
        with:
          contract_ir: .typespec-json-schema-validator/contract-ir.json
          report: .typespec-json-schema-validator/report.json
          typespec: test/fixtures/schema-authority-canary/main.tsp
          schema: test/fixtures/schema-authority-canary/authored.schema.json
          generated_schema: .typespec-json-schema-validator/generated/typespec.generated.schema.json
          expected_declarations: '["OreSchemaAuthority.AuthorityKind","OreSchemaAuthority.PeerAuthorityRegistration"]'

      # This validates real service configuration rather than just the installation canary.
      - name: Compare independent product transport TypeSpec and JSON Schema
        uses: ORESoftware/typespec-json-schema-validator@5b04b08512f8a03a376dcb96818969e2d83c2d84
        with:
          typespec: contracts/transport/web-api-plane-binding.v1.tsp
          schema: contracts/transport/web-api-plane-binding.v1.schema.json
          report: .typespec-json-schema-validator/transport/report.json
          contract_ir: .typespec-json-schema-validator/transport/contract-ir.json
          output_dir: .typespec-json-schema-validator/transport/generated
          max_probes: "64"

      - name: Verify exact-head product transport IR and admission refusals
        uses: ORESoftware/typespec-json-schema-validator/actions/test-consumer-admission@5b04b08512f8a03a376dcb96818969e2d83c2d84
        with:
          contract_ir: .typespec-json-schema-validator/transport/contract-ir.json
          report: .typespec-json-schema-validator/transport/report.json
          typespec: contracts/transport/web-api-plane-binding.v1.tsp
          schema: contracts/transport/web-api-plane-binding.v1.schema.json
          generated_schema: .typespec-json-schema-validator/transport/generated/typespec.generated.schema.json
          expected_declarations: '["OresWebApiPlane.WebApiPlaneBinding"]'

      - name: Ensure neither authored transport authority was overwritten
        run: git diff --exit-code -- contracts/transport/

      - name: Prove native API-plane constants match Schema A
        run: cargo test --locked web_api_plane_binding_matches_peer_authority

      - name: Verify authored authorities were not modified
        shell: bash
        run: git diff --exit-code -- test/fixtures/schema-authority-canary/

      - name: Retain diagnostic receipt, IR and comparison witness
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: schema-peer-authority-${{ github.event.repository.name }}-${{ github.run_id }}
          path: .typespec-json-schema-validator/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
