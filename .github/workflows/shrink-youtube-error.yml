name: Shrink YouTube error

on:
  push:
    branches:
      - agent/den-262-youtube-gas-control-plane

permissions:
  contents: write

concurrency:
  group: shrink-youtube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Remove oversized and sensitive upstream preview
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/youtube.rs')
          text = path.read_text()

          old = '''        if !status.is_success() {
              let body = String::from_utf8_lossy(&bytes);
              let body = body.chars().take(500).collect::<String>();
              return Err(YoutubeClientError::UpstreamHttp {
                  status,
                  final_url,
                  location,
                  body,
              });
          }'''
          new = '''        if !status.is_success() {
              return Err(YoutubeClientError::UpstreamHttp {
                  status,
                  final_url,
                  location,
              });
          }'''
          if old not in text:
              raise SystemExit('upstream response constructor not found')
          text = text.replace(old, new, 1)

          old = '''    UpstreamHttp {
              status: StatusCode,
              final_url: Url,
              location: Option<String>,
              body: String,
          },'''
          new = '''    UpstreamHttp {
              status: StatusCode,
              final_url: Url,
              location: Option<String>,
          },'''
          if old not in text:
              raise SystemExit('upstream error variant not found')
          text = text.replace(old, new, 1)

          old = '''            Self::UpstreamHttp {
                  status,
                  final_url,
                  location,
                  body,
              } => Some(serde_json::json!({
                  "status": status.as_u16(),
                  "finalHost": final_url.host_str(),
                  "locationHost": location
                      .as_deref()
                      .and_then(|value| Url::parse(value).ok())
                      .and_then(|url| url.host_str().map(ToOwned::to_owned)),
                  "bodyPreview": body,
              })),'''
          new = '''            Self::UpstreamHttp {
                  status,
                  final_url,
                  location,
              } => Some(serde_json::json!({
                  "status": status.as_u16(),
                  "finalHost": final_url.host_str(),
                  "locationHost": location
                      .as_deref()
                      .and_then(|value| Url::parse(value).ok())
                      .and_then(|url| url.host_str().map(ToOwned::to_owned)),
              })),'''
          if old not in text:
              raise SystemExit('upstream error details block not found')
          path.write_text(text.replace(old, new, 1))

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format source
        run: cargo fmt --all

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/youtube.rs
          git commit -m 'Shrink and sanitize YouTube upstream errors'
          git push origin "HEAD:${GITHUB_REF_NAME}"
