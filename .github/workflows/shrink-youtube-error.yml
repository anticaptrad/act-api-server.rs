name: Shrink YouTube error

on:
  push:
    branches:
      - agent/den-262-youtube-gas-control-plane

permissions:
  contents: write

concurrency:
  group: shrink-youtube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Remove oversized and sensitive upstream preview
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/youtube.rs')
          text = path.read_text()
          replacements = [
              (
                  '            let body = String::from_utf8_lossy(&bytes);\n'
                  '            let body = body.chars().take(500).collect::<String>();\n',
                  '',
              ),
              ('                body,\n            });', '            });'),
              ('        body: String,\n', ''),
              ('                body,\n            } => Some(serde_json::json!({',
               '            } => Some(serde_json::json!({'),
              ('                "bodyPreview": body,\n', ''),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected source fragment not found: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format source
        run: cargo fmt --all

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/youtube.rs
          git commit -m 'Shrink and sanitize YouTube upstream errors'
          git push origin "HEAD:${GITHUB_REF_NAME}"
