name: Finalize DEN-400 lockfile

on:
  push:
    branches:
      - agent/den-262-youtube-gas-control-plane

permissions:
  contents: write

concurrency:
  group: finalize-den-400-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Regenerate lockfile
        run: |
          set -euo pipefail
          cargo generate-lockfile
          cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Commit resolved lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          if git diff --cached --quiet; then
            echo 'Cargo.lock already current.'
            exit 0
          fi
          git commit -m 'Pin resolved Rust dependencies for DEN-400'
          git push origin "HEAD:${GITHUB_REF_NAME}"
