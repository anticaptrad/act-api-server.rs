name: Finalize clasp lockfile

on:
  push:
    branches:
      - agent/den-399-optimize-clasp-workflow
  pull_request:
    branches:
      - main
    paths:
      - 'apps-script/**'
      - '.github/workflows/finalize-clasp-lockfile.yml'

permissions:
  contents: write

concurrency:
  group: clasp-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Generate and validate the lockfile
        working-directory: apps-script
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org
          npm ci --ignore-scripts --registry=https://registry.npmjs.org
          npm run check

      - name: Commit the resolved lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps-script/package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json already current.'
            exit 0
          fi
          git commit -m 'Pin clasp workflow dependencies'
          target_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          git push origin "HEAD:${target_branch}"
