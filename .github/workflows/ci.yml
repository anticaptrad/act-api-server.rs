name: CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject unresolved conflict markers
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .; then
            echo 'Unresolved Git conflict markers found.' >&2
            exit 1
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo build data
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee clippy.log

      - name: Preserve Clippy diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clippy-diagnostics
          path: clippy.log
          if-no-files-found: error
          retention-days: 7

      - name: Test
        run: cargo test --locked --all-targets --all-features

      - name: Build release binary
        run: cargo build --locked --release

  container:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build non-root image
        run: docker build --tag act-api-server:ci .

      - name: Confirm image runs as non-root
        run: |
          test "$(docker image inspect act-api-server:ci --format '{{.Config.User}}')" = '10001'

  deployed-gas:
    name: Deployed GAS health
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      GAS_WEB_APP_URL: https://script.google.com/macros/s/AKfycbwXNUnFogkqg_aeobBMLCas21CHJ8eIR8W1AnmEBNx7pPgfio8eARW5J4A-lu_V5gY/exec
    steps:
      - name: Exercise ContentService redirect and health response
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --max-time 30 \
            "${GAS_WEB_APP_URL}?action=health")"
          printf '%s\n' "$response" | jq -e '
            .ok == true and
            .data.app == "Anticaptrad YouTube Control Center" and
            (.data.version | type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) and
            (.data.timestamp | type == "string" and length > 0)
          '
          printf 'Live GAS health version: %s\n' "$(printf '%s\n' "$response" | jq -r '.data.version')"
