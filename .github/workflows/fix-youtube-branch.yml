name: Fix YouTube branch

on:
  push:
    branches:
      - agent/den-262-youtube-gas-control-plane

permissions:
  contents: write

concurrency:
  group: fix-youtube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply compatibility and ownership fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          routes = Path('src/routes.rs')
          text = routes.read_text()
          updated = text.replace('let status = match error {', 'let status = match &error {', 1)
          if updated == text:
              raise SystemExit('routes.rs match replacement not found')
          routes.write_text(updated)

          youtube = Path('src/youtube.rs')
          text = youtube.read_text()
          updated, count = re.subn(
              r'if let Some\(status\) = optional_string\(&object, "privacyStatus"\)\?\s*&& status != "private"\s*\{(?P<body>.*?)\n\s*\}',
              lambda match: 'if let Some(status) = optional_string(&object, "privacyStatus")? {\n'
                  '                if status != "private" {\n'
                  + match.group('body')
                  + '\n                }\n            }',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'youtube.rs privacy let-chain replacements: {count}')
          text = updated

          updated, count = re.subn(
              r'if let Some\(existing\) = optional_string\(&object, "idempotencyKey"\)\?\s*&& existing != header_key\s*\{(?P<body>.*?)\n\s*\}',
              lambda match: 'if let Some(existing) = optional_string(&object, "idempotencyKey")? {\n'
                  '                if existing != header_key {\n'
                  + match.group('body')
                  + '\n                }\n            }',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'youtube.rs idempotency let-chain replacements: {count}')
          youtube.write_text(updated)

      - name: Install rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format source
        run: cargo fmt --all

      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes.rs src/youtube.rs
          git commit -m 'Fix Rust compatibility and error ownership'
          git push origin "HEAD:${GITHUB_REF_NAME}"
