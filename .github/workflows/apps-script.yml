name: Validate Apps Script package

on:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'apps-script/**'
      - '.github/workflows/apps-script.yml'
  pull_request:
    paths:
      - 'apps-script/**'
      - '.github/workflows/apps-script.yml'

permissions:
  contents: read

concurrency:
  group: gas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps-script/package-lock.json

      - name: Install pinned clasp dependencies
        working-directory: apps-script
        run: npm ci --ignore-scripts

      - name: Reject unresolved conflict markers
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=node_modules apps-script; then
            echo 'Unresolved Git conflict markers found.' >&2
            exit 1
          fi

      - name: Validate Apps Script source, profiles, and clasp workflow
        working-directory: apps-script
        run: npm run check

      - name: Build review archive
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps-script/package.json').version")"
          archive="anticaptrad-youtube-gas-v${version}.zip"
          zip -qr "${archive}" apps-script \
            -x 'apps-script/node_modules/*'
          sha256sum "${archive}" > "${archive}.sha256"
          printf 'ARCHIVE=%s\n' "${archive}" >> "${GITHUB_ENV}"

      - name: Upload validated package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anticaptrad-youtube-gas-v1.1.0
          path: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
          if-no-files-found: error
          retention-days: 14
