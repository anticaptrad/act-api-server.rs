[package]
name = "act_api_server"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
k8s-web-api-data-plane = { git = "https://github.com/ORESoftware/k8s-libs-and-shared-defs.git", rev = "55adadc9f6d223d40b28ae66097dfe16930951b1", package = "k8s-web-api-data-plane" }
async-trait = "0.1"
tokio = { version = "1.37.0", features = ["full"] }
axum = "0.7.5"
axum-server = "=0.7.3"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.115"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing-opentelemetry = "0.28.0"
opentelemetry = "0.27.0"
opentelemetry_sdk = { version = "0.27.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27.0", features = ["grpc-tonic", "trace"] }
async-nats = "0.50"
futures = "0.3"
hmac = "0.12"
anyhow = "1.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rustls = "0.23"
sha2 = "0.10"
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["codec"] }
next-loggers = { git = "https://github.com/ores-otel/ores.otel.log", rev = "ca176fb6768a9750d262a536952268625ffd3a8a", package = "oresoftware-next-loggers" }
sea-orm = { version = "1.1.20", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
shared-auth-client = { git = "https://github.com/shared-auth/shared-auth-clients", rev = "cc57a85b276bee81ad94decc87df2f48d49cab9f", package = "shared-auth-client" }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
